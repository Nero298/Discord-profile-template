<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24hMissEm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@800&family=Poppins:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="entry-screen" id="entryScreen" role="button" tabindex="0" aria-label="Click to enter">
  <span class="entry-label">CLICK TO ENTER</span>
</div>
<div class="bg" id="bg"></div>
<video class="bgvid" id="bgvid" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<div class="shade"></div>
<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<!-- Nhạc: nút góc trái trên + bảng phát -->
<button class="music-btn" id="musicBtn" type="button" aria-label="Nhạc" aria-expanded="false" aria-controls="player">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
</button>

<section class="player" id="player" aria-label="Trình phát nhạc">
  <div class="p-head">
    <img class="cover" id="pCover" alt="">
    <div class="meta">
      <div class="title" id="pTitle"></div>
      <div class="artist" id="pArtist"></div>
    </div>
    <button class="icon-btn" id="pClose" type="button" aria-label="Đóng">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <div class="seek">
    <span id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Tua">
    <span id="tDur">0:00</span>
  </div>

  <div class="ctrl">
    <button class="icon-btn" id="bBack" type="button" aria-label="Lùi 10 giây">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.5" font-weight="700" font-family="Poppins,sans-serif">10</text></svg>
    </button>
    <button class="play" id="bPlay" type="button" aria-label="Phát / tạm dừng">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <button class="icon-btn" id="bFwd" type="button" aria-label="Tới 10 giây">
      <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.5" font-weight="700" font-family="Poppins,sans-serif">10</text></svg>
    </button>
    <button class="icon-btn" id="bNext" type="button" aria-label="Bài tiếp theo">
      <svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM17 5h2v14h-2z"/></svg>
    </button>
  </div>

</section>

<div class="stack">
<div class="ghost top" id="ghostTop"></div>
<div class="float">
  <main class="card">
    <div class="banner" id="banner">
      <div class="views" id="views" title="Lượt truy cập">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewCount">—</span>
      </div>
    </div>

    <div class="body">
      <div class="left">
        <div class="av">
          <img class="pfp" id="pfp" alt="avatar">
          <img class="deco" id="deco" alt="">
          <span class="dot offline" id="dot" title="offline"></span>
        </div>
        <div class="icons" id="icons"></div>
      </div>

      <div class="info">
        <div class="name"><span id="dname"></span><span class="tag" id="tag" hidden></span></div>
        <div class="uid" id="uid"></div>
        <div class="links" id="links"></div>
        <div class="bio" id="bio"></div>
        <div class="langs"><b>Language:</b><span class="langs-list" id="langs"></span></div>
      </div>
    </div>
  </main>
</div>
<div class="ghost bot" id="ghostBot"></div>
</div>

<div id="dvd-text" aria-hidden="true"></div>
<img id="custom-cursor" alt="" hidden>

<audio id="audio" preload="auto" playsinline></audio>

<script src="js/config.js"></script>
<script src="js/profile.js"></script>
<script src="js/fx.js"></script>
<script src="js/player.js"></script>
<script>
(() => {
  const screen = document.getElementById("entryScreen");
  if (!screen) return;
  const enter = () => {
    screen.classList.add("leaving");
    document.body.classList.add("entered");
    screen.addEventListener("transitionend", () => screen.remove(), { once: true });
    window.setTimeout(() => screen.remove(), 700);
  };
  screen.addEventListener("click", enter, { once: true });
  screen.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      enter();
    }
  });
})();
</script>
</body>
</html>
